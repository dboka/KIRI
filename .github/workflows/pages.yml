name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static frontend
        run: |
          test -f GRID_SAGATAVE/frontend/index.html
          test -f GRID_SAGATAVE/frontend/.nojekyll
          node --check GRID_SAGATAVE/frontend/src/main.js
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("GRID_SAGATAVE/frontend/data")
          calendar = json.loads((root / "calendar_manifest.json").read_text(encoding="utf-8"))
          assert calendar["date_count"] == len(calendar["dates"]) == 60
          assert calendar["default_date"] == calendar["dates"][-1]["date"]
          assert len(list((root / "grid_static").glob("*.geojson"))) == 43

          archive_path = root / "archive_manifest.json"
          assert archive_path.exists()
          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          assert archive["visible_date_count"] == 60

          value_files = 0
          for item in calendar["dates"]:
              manifest = json.loads((root / item["manifest_file"]).read_text(encoding="utf-8"))
              assert len(manifest) == item["municipality_count"], item["date"]
              for code, row in manifest.items():
                  assert row["static_grid_file"] == f"grid_static/{code}.geojson"
                  assert row["grid_values_file"] == f"grid_values/{item['date']}/{code}.json"
                  assert (root / row["static_grid_file"]).exists()
                  assert (root / row["grid_values_file"]).exists()
                  value_files += 1

          assert value_files == sum(item["grid_file_count"] for item in calendar["dates"])
          print("KIRI-LV static frontend validation passed.")
          PY

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: GRID_SAGATAVE/frontend

      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for attempt in range(30):
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=30
              ) as response:
                  artifacts = json.load(response)["artifacts"]
              matches = [item for item in artifacts if item["name"] == "github-pages"]
              if len(matches) == 1:
                  print(f"Pages artifact registered: {matches[0]['id']}")
                  break
              if len(matches) > 1:
                  raise RuntimeError("Multiple github-pages artifacts in this run")
              print(f"Pages artifact not visible yet ({attempt + 1}/30)")
              time.sleep(10)
          else:
              raise RuntimeError("Pages artifact was not registered within five minutes")
          PY

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
